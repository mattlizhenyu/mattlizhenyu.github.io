<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李振宇 Matt · IT 工程师</title>
<meta name="description" content="海程邦达供应链 · 空运事业部 IT 工程师。IT 运维、RPA 开发、AI 业务落地。">
<meta name="theme-color" content="#0B111E">
<link rel="icon" href="avatar.png">
<meta property="og:type" content="profile">
<meta property="og:title" content="李振宇 Matt · IT 工程师">
<meta property="og:description" content="把效率工具变成生产力 — IT 运维、RPA 开发、AI 业务落地">
<meta property="og:image" content="avatar.png">
<meta name="twitter:card" content="summary">
<style>
/* ============ 色彩系统 ============ */
:root{
  --navy: hsl(222 47% 8%);
  --navy-light: hsl(220 40% 13%);
  --navy-card: hsl(220 40% 16%);
  --dark-text: hsl(220 14% 96%);
  --dark-muted: hsl(220 10% 62%);
  --dark-border: hsl(220 30% 20%);

  --bg: hsl(220 20% 98%);
  --card: #fff;
  --fg: hsl(222 47% 11%);
  --muted-fg: hsl(220 12% 48%);
  --border: hsl(220 18% 90%);

  --primary: hsl(38 92% 50%);
  --primary-2: hsl(25 95% 55%);
  --primary-ink: hsl(32 88% 40%);
  --primary-glow: hsl(38 92% 50% / .15);

  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,p{margin:0}
svg{display:block}
.ico{width:20px;height:20px;flex:none}
::selection{background:hsl(38 92% 50% / .25)}

.wrap{width:100%;max-width:1152px;margin:0 auto;padding:0 1.5rem}
@media(min-width:768px){.wrap{padding:0 2rem}}

.sec{position:relative;padding:5rem 0}
@media(min-width:768px){.sec{padding:7rem 0}}
.light{background:var(--bg)}
.dark{background:var(--navy);color:var(--dark-text)}

/* ============ 顶部导航 ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:64px;z-index:50;
  background:hsl(222 47% 8% / .82);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--dark-border);
}
.topbar-in{
  height:100%;max-width:1152px;margin:0 auto;padding:0 1.5rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
@media(min-width:768px){.topbar-in{padding:0 2rem}}
.brand{font-size:18px;font-weight:700;color:#fff;letter-spacing:.01em;transition:color .2s}
.brand:hover{color:var(--primary)}

.nav-desk{display:none;align-items:center;gap:4px}
@media(min-width:900px){.nav-desk{display:flex}}
.nav-link{
  position:relative;padding:10px 12px;font-size:14px;font-weight:500;
  color:var(--dark-muted);transition:color .2s;border-radius:6px;white-space:nowrap;
}
.nav-link:hover{color:#fff}
.nav-link::after{
  content:"";position:absolute;left:50%;bottom:2px;width:24px;height:2px;border-radius:2px;
  background:var(--primary);transform:translateX(-50%) scaleX(0);transform-origin:center;
  transition:transform .3s cubic-bezier(.25,.1,.25,1);
}
.nav-link.active{color:#fff}
.nav-link.active::after{transform:translateX(-50%) scaleX(1)}

.burger{
  width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:5px;border-radius:8px;
}
.burger span{display:block;width:20px;height:2px;background:#fff;border-radius:2px;transition:transform .25s ease,opacity .2s ease,background .25s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg);background:var(--primary)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);background:var(--primary)}
@media(min-width:900px){.burger{display:none}}

.mmenu{
  position:fixed;inset:64px 0 0;z-index:49;
  background:hsl(222 47% 8% / .97);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease;
}
.mmenu.open{opacity:1;visibility:visible}
.mmenu-in{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2rem}
.mmenu-link{font-size:24px;font-weight:500;color:#fff;padding:12px 24px;transition:color .2s}
.mmenu-link.active{color:var(--primary)}
.mmenu-link.active::after{content:"";display:block;width:24px;height:2px;background:var(--primary);border-radius:2px;margin:8px auto 0}

/* ============ 首屏 ============ */
.hero{
  position:relative;min-height:800px;height:100vh;max-height:1100px;
  display:flex;align-items:center;justify-content:center;
  background:var(--navy);overflow:hidden;text-align:center;
  padding:64px 1.5rem 0;
}
@media(max-width:767px){.hero{min-height:0;height:auto;max-height:none;padding:132px 1.5rem 112px}}

.hero-grid,.hero-dots,.hero-glow{position:absolute;inset:0;pointer-events:none}
.hero-grid{
  background-image:
    linear-gradient(to right, hsl(220 30% 20% / .3) 1px, transparent 1px),
    linear-gradient(to bottom, hsl(220 30% 20% / .3) 1px, transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 100%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 100%);
}
.hero-dots{
  background-image:radial-gradient(circle, hsl(38 92% 50% / .3) 1px, transparent 1px);
  background-size:60px 60px;opacity:.4;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 100%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 25%,transparent 100%);
}
.hero-glow{
  background:radial-gradient(ellipse 60% 50% at 50% 40%, hsl(38 92% 50% / .15), transparent 70%);
  animation:breathe 3s ease-in-out infinite;
}

.shp{position:absolute;pointer-events:none}
.shp-circle{width:96px;height:96px;border-radius:50%;border:1px solid rgba(255,255,255,.07);top:16%;left:7%;animation:floatY 6s ease-in-out infinite}
.shp-square{width:64px;height:64px;border:1px solid rgba(255,255,255,.06);bottom:20%;right:9%;transform:rotate(45deg);animation:floatRot 8s ease-in-out infinite}
.shp-dot{width:40px;height:40px;border-radius:50%;border:1px solid hsl(38 92% 50% / .1);top:58%;right:13%;animation:floatY2 5s ease-in-out infinite 1s}
@media(max-width:767px){.shp-circle{width:64px;height:64px;left:4%}.shp-square{width:44px;height:44px;right:6%}.shp-dot{display:none}}

.hero-in{position:relative;z-index:2;max-width:760px;width:100%;min-width:0}
.hero-name{
  font-size:clamp(38px,6vw,60px);font-weight:900;line-height:1.12;
  letter-spacing:-.02em;color:#fff;
}
.hn-sep{color:hsl(220 10% 38%);font-weight:300;margin:0 .16em}
.hn-en{font-weight:300;color:var(--dark-muted);font-size:.72em}
.hero-motto{
  position:relative;margin-top:1rem;
  font-size:clamp(26px,4.4vw,48px);font-weight:800;line-height:1.22;letter-spacing:-.01em;
  background:linear-gradient(to right, hsl(38 92% 50%), hsl(25 95% 55%));
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.hero-motto::before{
  content:"";position:absolute;inset:-45% -12%;z-index:-1;
  background:radial-gradient(ellipse 50% 55% at 50% 50%, hsl(38 92% 50% / .22), transparent 70%);
  filter:blur(22px);animation:breathe 3s ease-in-out infinite;
}
.hero-org{margin-top:1.35rem;font-size:clamp(15px,1.7vw,20px);font-weight:300;color:var(--dark-muted)}
.hero-tag{margin:.7rem auto 0;max-width:576px;font-size:15px;line-height:1.75;color:hsl(220 10% 62% / .82)}
.hero-btns{margin-top:2.25rem;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:12px 32px;border-radius:999px;font-size:14px;font-weight:600;
  transition:transform .2s ease,box-shadow .25s ease,background .25s ease,border-color .3s ease ease;
}
.btn-primary{background:var(--primary);color:hsl(222 47% 11%)}
.btn-primary:hover{box-shadow:0 8px 24px hsl(38 92% 50% / .2);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.95)}
.btn-ghost{border:2px solid var(--dark-border);color:#fff}
.btn-ghost:hover{border-color:var(--primary);background:hsl(38 92% 50% / .05)}
.btn-ghost:active{transform:scale(.95)}

.scroll-hint{
  position:absolute;bottom:28px;left:50%;translate:-50% 0;z-index:2;
  color:hsl(38 92% 50% / .85);padding:8px;
  filter:drop-shadow(0 0 7px hsl(38 92% 50% / .5));
  transition:color .3s ease,filter .3s ease;
}
.scroll-hint:hover{color:var(--primary);filter:drop-shadow(0 0 12px hsl(38 92% 50% / .8))}
.scroll-hint svg{
  position:relative;z-index:1;width:28px;height:28px;
  animation:scrollFlow 1.9s cubic-bezier(.5,0,.5,1) infinite;
}
/* 箭头后面跟一个淡出的残影，强化“一直往下走”的方向感 */
.scroll-hint::after{
  content:"";position:absolute;left:50%;top:50%;width:17px;height:17px;margin:-11px 0 0 -8.5px;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  pointer-events:none;
  animation:scrollFlowGhost 1.9s cubic-bezier(.5,0,.5,1) infinite;
}

/* ============ 区块标题 ============ */
.sec-head{margin-bottom:2.75rem}
.sec-title{
  display:flex;align-items:center;gap:16px;
  font-size:clamp(26px,3.2vw,32px);font-weight:800;line-height:1.25;
  letter-spacing:-.01em;color:var(--fg);
}
.dark .sec-title{color:#fff}
.sec-title::before{content:"";flex:none;background:var(--primary);border-radius:2px}
.sec-title.bar3::before{width:3px;height:1.05em}
.sec-title.bar4::before{width:4px;height:1.1em}
.sec-title.tick::before{width:4px;height:8px}
.sec-sub{margin-top:.7rem;padding-left:19px;font-size:17px;font-weight:300;line-height:1.65;color:var(--muted-fg)}
.dark .sec-sub{color:var(--dark-muted)}

/* ============ 关于我 ============ */
.about-grid{display:grid;gap:2.5rem}
@media(min-width:900px){.about-grid{grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:3.5rem;align-items:start}}
.quote{position:relative;padding-left:1.25rem;font-size:clamp(20px,2.2vw,24px);font-weight:600;line-height:1.55;color:var(--fg)}
.quote::before{
  content:"";position:absolute;left:0;top:.12em;bottom:.12em;width:3px;border-radius:3px;
  background:linear-gradient(180deg, hsl(38 92% 50%), hsl(25 95% 55%));
}
.about-p{margin-top:1.15rem;font-size:16px;line-height:1.95;color:hsl(220 12% 34%)}
.about-p:first-of-type{margin-top:1.6rem}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.75rem}
.tag{
  padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;
  background:hsl(38 92% 50% / .08);color:var(--primary-ink);
  border:1px solid hsl(38 92% 50% / .15);
}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
  transition:transform .45s cubic-bezier(.22,.61,.36,1),border-color .35s ease,box-shadow .45s cubic-bezier(.22,.61,.36,1);
}
.info-card:hover{transform:translateY(-2px);border-color:hsl(38 92% 50% / .35);box-shadow:0 6px 18px -6px hsl(38 92% 50% / .18)}
.info-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px}
.info-ico .ico{width:18px;height:18px}
.info-label{font-size:11px;letter-spacing:.04em;color:var(--muted-fg)}
.info-val{margin-top:3px;font-size:14px;font-weight:600;line-height:1.4;color:var(--fg)}
.t-amber{background:hsl(38 92% 50% / .1);color:hsl(32 88% 42%)}
.t-blue{background:hsl(221 83% 53% / .1);color:hsl(221 83% 48%)}
.t-green{background:hsl(152 60% 42% / .1);color:hsl(152 60% 34%)}
.t-yellow{background:hsl(45 93% 47% / .12);color:hsl(40 85% 38%)}

/* ============ 工作职责 ============ */
.work-grid{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:768px){.work-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.work-grid{grid-template-columns:repeat(3,1fr)}}
.work-card{
  position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.02);
  transition:transform .45s cubic-bezier(.22,.61,.36,1),box-shadow .45s cubic-bezier(.22,.61,.36,1),border-color .35s ease;
}
.work-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, hsl(38 92% 50%), hsl(25 95% 55%));
  opacity:0;transition:opacity .4s ease;
}
.work-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%, hsl(38 92% 50% / .06), transparent 70%);
  opacity:0;transition:opacity .4s ease;
}
.work-card:hover{transform:translateY(-4px);border-color:hsl(38 92% 50% / .3);box-shadow:0 12px 40px -8px hsl(38 92% 50% / .12),0 4px 12px -2px rgba(0,0,0,.06)}
.work-card:hover::before,.work-card:hover::after{opacity:1}
.work-ico{
  position:relative;z-index:1;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:hsl(38 92% 50% / .1);color:hsl(32 88% 42%);
  transition:background .35s ease,transform .4s cubic-bezier(.22,.61,.36,1);
}
.work-card:hover .work-ico{background:hsl(38 92% 50% / .15);transform:scale(1.05)}
.work-title{position:relative;z-index:1;margin-top:18px;font-size:18px;font-weight:700;color:var(--fg)}
.work-sub{position:relative;z-index:1;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--primary-ink)}
.work-desc{position:relative;z-index:1;margin-top:14px;font-size:14px;line-height:1.85;color:var(--muted-fg)}
.work-tags{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.work-tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:6px;font-size:12px;
  background:hsl(220 14% 95%);color:hsl(220 12% 42%);transition:background .35s ease,color .35s ease;
}
.work-tag .ico{width:13px;height:13px;flex:none}
.work-card:hover .work-tag{background:hsl(38 92% 50% / .08);color:hsl(222 47% 18%)}
.work-note{display:flex;align-items:center;gap:8px;margin-top:24px;font-size:13px;color:var(--muted-fg)}
.work-note .ico{width:16px;height:16px;color:hsl(32 88% 45%)}

/* ============ 技能矩阵 ============ */
.skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:900px){.skills-grid{grid-template-columns:repeat(4,1fr)}}
.skill-card{
  position:relative;overflow:hidden;background:var(--navy-card);
  border:1px solid var(--dark-border);border-radius:8px;padding:20px;
  transition:transform .24s cubic-bezier(.22,.61,.36,1),border-color .35s ease,box-shadow .4s ease;
  will-change:transform;transform-style:preserve-3d;
}
.sk-sheen{
  position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:linear-gradient(135deg, var(--brand-soft), hsl(38 92% 50% / .1));
}
.skill-card:hover{border-color:hsl(38 92% 50% / .4);box-shadow:0 14px 34px -14px var(--brand),0 10px 30px -18px hsl(38 92% 50% / .5)}
.skill-card:hover .sk-sheen{opacity:1}
.sk-avatar{
  position:relative;z-index:1;width:40px;height:40px;border-radius:10px;
  display:grid;place-items:center;font-size:13px;font-weight:700;
  background:var(--brand-soft);color:var(--brand);
}
.sk-name{position:relative;z-index:1;margin-top:14px;font-size:14px;font-weight:600;color:#fff}
.sk-desc{position:relative;z-index:1;margin-top:5px;font-size:12px;line-height:1.6;color:var(--dark-muted);transition:color .3s}
.skill-card:hover .sk-desc{color:hsl(220 10% 76%)}
.sk-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:30px;font-size:12px;color:var(--dark-muted)}
.sk-legend span{display:inline-flex;align-items:center;gap:7px}
.legend-dot{width:6px;height:6px;border-radius:50%;opacity:.6}

/* ============ 兴趣爱好 ============ */
.hob-decos{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hob-deco{position:absolute;pointer-events:none;border-radius:50%}
.hob-deco.l{left:-15%;bottom:-30%;width:70%;height:90%;background:radial-gradient(circle, hsl(38 92% 50% / .04), transparent 60%)}
.hob-deco.r{right:-15%;top:-20%;width:70%;height:90%;background:radial-gradient(circle, hsl(221 83% 53% / .03), transparent 60%)}
.hob-list{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.hobby-wrap{position:relative;display:inline-block}
.hobby-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500;
  background:hsl(38 92% 50% / .1);color:var(--primary-ink);
  border:1px solid hsl(38 92% 50% / .2);
  transition:transform .35s cubic-bezier(.22,.61,.36,1),border-color .3s ease,box-shadow .35s ease,background .3s ease;
}
.hobby-pill:hover{transform:translateY(-3px);border-color:hsl(38 92% 50% / .45);box-shadow:0 6px 16px -6px hsl(38 92% 50% / .25)}
.hobby-pill.egg:hover{background:hsl(38 92% 50% / .14);box-shadow:0 8px 24px hsl(38 92% 50% / .1);border-color:hsl(38 92% 50% / .4)}
.hobby-pill .spark{font-size:11px;line-height:1}
.hobby-pill .ico{width:15px;height:15px;flex:none}
.note-body{padding:14px 16px;min-width:230px;max-width:300px;font-family:var(--mono);font-size:12px;line-height:2;color:var(--dark-text)}
.note-line{margin:0;white-space:pre-wrap}
.note-line.hl{color:var(--primary)}

.egg-pop{
  position:absolute;top:calc(100% + 10px);left:0;z-index:30;
  opacity:0;visibility:hidden;translate:0 8px;scale:.95;
  transition:opacity .28s cubic-bezier(.22,.61,.36,1),translate .28s cubic-bezier(.22,.61,.36,1),scale .28s cubic-bezier(.22,.61,.36,1),visibility .28s;
}
.hobby-wrap.open .egg-pop{opacity:1;visibility:visible;translate:0 0;scale:1}
@media(max-width:560px){.egg-pop{left:50%;translate:-50% 8px}.hobby-wrap.open .egg-pop{translate:-50% 0}.term,.dogtag{max-width:calc(100vw - 32px)}}

.term{
  width:280px;border-radius:8px;overflow:hidden;background:var(--navy);
  border:1px solid var(--dark-border);box-shadow:0 18px 44px -14px rgba(0,0,0,.55);
  text-align:left;
}
.term-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--navy-light)}
.term-dot{width:10px;height:10px;border-radius:50%}
.term-bar small{margin-left:6px;font-family:var(--mono);font-size:11px;color:var(--dark-muted)}
.term-body{padding:12px;min-height:150px;font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--dark-text)}
.term-line{white-space:pre-wrap;word-break:break-word}
.t-user{color:hsl(152 60% 52%)}
.t-path{color:hsl(220 10% 55%)}
.t-prompt{color:var(--primary)}
.t-cmd{color:#fff}
.t-out{color:hsl(220 14% 78%)}
.term-cursor{display:inline-block;width:6px;height:12px;background:hsl(152 60% 52%);vertical-align:-1px;animation:blink 1s step-end infinite}

.dogtag{
  position:relative;width:236px;overflow:hidden;text-align:left;
  padding:24px 16px 16px;border-radius:10px;background:var(--navy-light);
  border:1px solid var(--dark-border);box-shadow:0 18px 44px -14px rgba(0,0,0,.55);
  font-family:var(--mono);font-size:11px;color:var(--dark-text);
}
.dogtag::before{
  content:"";position:absolute;top:6px;left:50%;translate:-50% 0;
  width:12px;height:12px;border-radius:50%;background:var(--navy);
  border:2px solid hsl(220 30% 20%);box-shadow:inset 0 1px 2px rgba(0,0,0,.7);
}
.dogtag::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(hsl(95 30% 28% / .12) 0% 25%, hsl(45 20% 22% / .1) 0% 50%) 0 / 18px 18px;
  opacity:.6;
}
.dt-head{position:relative;z-index:1;display:flex;align-items:center;gap:6px;color:var(--dark-muted);font-size:10px;letter-spacing:.14em}
.dt-row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px;margin-top:7px}
.dt-key{color:hsl(220 10% 50%)}
.dt-val{color:#fff}
.dt-blood{color:var(--primary)}
.dt-motto{
  position:relative;z-index:1;margin-top:12px;padding-top:10px;
  border-top:1px solid hsl(220 30% 20%);
  font-style:italic;font-size:10.5px;line-height:1.55;color:var(--primary);
}

/* ============ 个人积累 ============ */
.pf-grid{display:grid;gap:20px}
@media(min-width:900px){.pf-grid{grid-template-columns:repeat(3,1fr)}}
.pf-card{
  position:relative;display:block;overflow:hidden;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:24px 24px 22px 26px;
  box-shadow:0 2px 12px rgba(0,0,0,.02);
  transition:transform .45s cubic-bezier(.22,.61,.36,1),box-shadow .45s cubic-bezier(.22,.61,.36,1);
}
.pf-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand);transition:width .35s cubic-bezier(.22,.61,.36,1)}
.pf-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px -4px hsl(38 92% 50% / .08),0 4px 12px -2px hsl(38 92% 50% / .05)}
.pf-card:hover::before{width:6px}
.pf-card:active{transform:scale(.98)}
.pf-top{display:flex;align-items:center;gap:10px}
.pf-ico{
  width:40px;height:40px;border-radius:10px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:700;
  transition:transform .35s cubic-bezier(.22,.61,.36,1);
}
.pf-card:hover .pf-ico{transform:scale(1.05)}
.pf-plat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg)}
.pf-title{margin-top:16px;font-size:18px;font-weight:600;color:var(--fg);transition:color .3s ease}
.pf-card:hover .pf-title{color:var(--primary)}
.pf-desc{margin-top:8px;font-size:14px;line-height:1.8;color:var(--muted-fg)}
.pf-link{display:inline-flex;align-items:center;gap:5px;margin-top:18px;font-size:12.5px;color:var(--muted-fg);transition:color .3s ease}
.pf-link svg{width:14px;height:14px;transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.pf-card:hover .pf-link{color:var(--primary)}
.pf-card:hover .pf-link svg{transform:translate(2px,-2px)}

/* ============ 联系我 ============ */
.ct-methods{display:grid;gap:14px}
@media(min-width:768px){.ct-methods{grid-template-columns:1fr 1fr}}
.ct-card{
  display:flex;align-items:center;gap:16px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:18px 20px;
  box-shadow:0 2px 12px rgba(0,0,0,.02);
  transition:transform .45s cubic-bezier(.22,.61,.36,1),border-color .35s ease,box-shadow .45s cubic-bezier(.22,.61,.36,1);
}
.ct-card:hover{transform:translateY(-2px);border-color:hsl(38 92% 50% / .3);box-shadow:0 10px 28px -12px hsl(38 92% 50% / .3)}
.ct-ico{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;background:hsl(38 92% 50% / .1);color:hsl(32 88% 42%)}
.ct-label{font-size:11.5px;color:var(--muted-fg)}
.ct-val{margin-top:2px;font-size:18px;font-weight:600;color:var(--fg);word-break:break-all;transition:color .3s ease}
.ct-card:hover .ct-val{color:var(--primary)}
.ct-out{margin-left:auto;flex:none;color:var(--muted-fg);opacity:0;transition:opacity .3s ease}
.ct-out svg{width:16px;height:16px}
.ct-card:hover .ct-out{opacity:1}

.ct-sub{margin-top:36px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--fg)}
.prefs{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}
.pref{display:inline-flex;align-items:center;gap:8px;border-radius:999px;transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.pref:hover{transform:scale(1.05)}
.pref-primary{padding:10px 20px;font-size:16px;font-weight:600;background:hsl(38 92% 50% / .15);border:1px solid hsl(38 92% 50% / .3);color:hsl(32 88% 36%)}
.pref-mid{padding:8px 16px;font-size:14px;background:hsl(38 92% 50% / .1);border:1px solid hsl(38 92% 50% / .2);color:var(--primary-ink)}
.pref-low{padding:7px 14px;font-size:14px;background:hsl(220 14% 96%);border:1px solid var(--border);color:hsl(220 12% 42%)}
.pref-rank{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:hsl(38 92% 50% / .2);color:hsl(32 88% 36%)}
.pref-low .pref-rank{background:hsl(220 14% 90%);color:hsl(220 12% 45%)}
.ct-notes{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:20px;font-size:13px;color:var(--muted-fg)}
.ct-notes span{display:inline-flex;align-items:center;gap:7px}
.ct-notes svg{width:15px;height:15px;color:hsl(32 88% 45%)}
.ct-offices{display:grid;gap:14px;margin-top:26px}
@media(min-width:768px){.ct-offices{grid-template-columns:1fr 1fr}}
.office{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:transform .45s cubic-bezier(.22,.61,.36,1),border-color .35s ease,box-shadow .45s cubic-bezier(.22,.61,.36,1)}
.office:hover{transform:translateY(-3px);border-color:hsl(38 92% 50% / .3);box-shadow:0 10px 28px -12px hsl(38 92% 50% / .18)}
.office svg{width:17px;height:17px;color:hsl(32 88% 45%);margin-top:3px}
.office-label{font-size:11.5px;color:var(--muted-fg)}
.office-val{margin-top:2px;font-size:14px;font-weight:600;color:var(--fg)}

/* ============ 页脚 ============ */
.foot{background:var(--navy);padding:64px 0 56px;text-align:center}
.foot-motto{font-size:14px;font-style:italic;color:var(--dark-muted)}
.foot-div{display:block;width:16px;height:1px;background:var(--dark-border);margin:18px auto}
.foot-copy{font-size:12px;color:hsl(220 10% 50%)}
.foot-actions{margin-top:22px;display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap}
.foot-btn,.foot-top{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dark-muted);transition:color .2s}
.foot-btn svg{width:14px;height:14px}
.foot-btn:hover,.foot-top:hover{color:var(--primary)}
.foot-top svg{width:13px;height:13px;transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.foot-top:hover svg{transform:translateY(-2px)}

/* ============ 动画 ============ */
@keyframes revealUp{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@keyframes fadeUp{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
@keyframes breathe{0%,100%{opacity:.08}50%{opacity:.2}}
@keyframes floatY{0%,100%{transform:translateY(-12px)}50%{transform:translateY(12px)}}
@keyframes floatY2{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
@keyframes floatRot{0%,100%{transform:rotate(45deg) translateY(-8px)}50%{transform:rotate(50deg) translateY(8px)}}
@keyframes scrollFlow{
  0%{transform:translateY(-7px);opacity:0}
  15%{opacity:1}
  70%{transform:translateY(7px);opacity:1}
  100%{transform:translateY(15px);opacity:0}
}
@keyframes scrollFlowGhost{
  0%{transform:translateY(-9px) rotate(45deg);opacity:0}
  15%{opacity:.32}
  70%{transform:translateY(5px) rotate(45deg);opacity:.22}
  100%{transform:translateY(13px) rotate(45deg);opacity:0}
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.reveal{opacity:0}
.reveal.in{animation:revealUp .55s cubic-bezier(.25,.1,.25,1) both}
.reveal-stagger>*{opacity:0}
.reveal-stagger.in>*{animation:revealUp .5s cubic-bezier(.25,.1,.25,1) both}
.reveal-stagger.in>*:nth-child(1){animation-delay:0s}
.reveal-stagger.in>*:nth-child(2){animation-delay:.1s}
.reveal-stagger.in>*:nth-child(3){animation-delay:.2s}
.reveal-stagger.in>*:nth-child(4){animation-delay:.3s}
.reveal-stagger.in>*:nth-child(5){animation-delay:.4s}
.reveal-stagger.in>*:nth-child(6){animation-delay:.5s}
.reveal-stagger.in>*:nth-child(7){animation-delay:.6s}
.reveal-stagger.in>*:nth-child(8){animation-delay:.7s}
.reveal-stagger.in>*:nth-child(9){animation-delay:.8s}
.reveal-stagger.in>*:nth-child(10){animation-delay:.9s}

.hero-in>*{opacity:0;animation:fadeUp .5s cubic-bezier(.25,.1,.25,1) both}
.hero-in>*:nth-child(1){animation-delay:.15s}
.hero-in>*:nth-child(2){animation-delay:.25s}
.hero-in>*:nth-child(3){animation-delay:.35s}
.hero-in>*:nth-child(4){animation-delay:.45s}
.hero-in>*:nth-child(5){animation-delay:.55s}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal,.reveal-stagger>*,.hero-in>*{opacity:1!important;translate:none!important}
}

/* 截图自查用：#capture 时强制全部展开，不影响正常访问 */
.capture .reveal,.capture .reveal-stagger>*,.capture .hero-in>*{opacity:1!important;animation:none!important;translate:none!important}
.capture *{animation:none!important;transition:none!important}

/* ============ 打印 / 存 PDF ============ */
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important}
  .topbar,.mmenu,.burger,.hero-grid,.hero-dots,.hero-glow,.shp,.scroll-hint,.hero-btns,.foot-actions,.sk-legend,.hob-deco,.egg-pop{display:none!important}
  .sec,.dark,.foot{background:#fff!important;padding:16px 0!important;color:#111!important;page-break-inside:avoid}
  .hero{display:block!important;height:auto!important;min-height:0!important;max-height:none!important;padding:0 0 18px!important;background:#fff!important;text-align:left!important}
  .hero-in{max-width:100%}
  .hero-name,.hn-en,.hn-sep,.hero-motto,.hero-org,.hero-tag{color:#111!important;-webkit-text-fill-color:#111!important;background:none!important}
  .hero-motto::before,.work-card::before,.work-card::after,.pf-card::before{display:none!important}
  .hero-name{font-size:26pt}
  .hero-motto{font-size:18pt;margin-top:4px}
  .hero-org{font-size:11pt;margin-top:6px}
  .hero-tag{font-size:10pt}
  .sec-title,.sec-sub,.work-title,.work-sub,.work-desc,.pf-title,.pf-desc,.pf-plat,.ct-val,.ct-label,.info-val,.info-label,.sk-name,.sk-desc,.office-val,.office-label,.foot-copy,.foot-motto,.hobby-pill,.about-p,.quote,.work-tag,.tag{color:#111!important}
  .skill-card,.work-card,.pf-card,.info-card,.ct-card,.office{background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important;break-inside:avoid}
  .sk-avatar{background:#f1f1f1!important;color:#111!important}
  .skills-grid{grid-template-columns:repeat(4,1fr)!important}
  .dark .sec-sub{color:#444!important}
  a{color:#111!important}
  .ico{width:16px;height:16px}
}

    termico: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    dot: '<circle cx="12" cy="12" r="3"/>'
  };
  function ico(name, cls){
    return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[name] || '') + '</svg>';
  }
  function tint(hex, a){
    var h = String(hex).replace('#','');
    if (h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  /* ---------- 工作职责详情标签图标（按文案匹配，改文案时同步这里） ---------- */
  var TAG_ICONS = {
    '软硬件运维': 'monitor',
    '宽带/局域网': 'wifi',
    '视频会议系统': 'video',
    '服务器管理': 'server',
    '流程开发': 'branch',
    '流程优化': 'loop',
    '效率提升': 'zap',
    '需求对接': 'chat',
    '场景挖掘': 'bulb',
    '技术调研': 'search',
    '方案落地': 'box',
    '持续迭代': 'repeat'
  };

  /* ---------- 爱好标签图标 ---------- */
  var HB_ICONS = {
    '看书': 'book',
    '探索新技术': 'flask',
    '篮球': 'trophy',
    '乒乓球': 'pong',
    'Linux': 'termico',
    '军迷': 'shield'
  };

  /* ---------- 站点元信息 ---------- */
  if (D.site) {
    if (D.site.title) document.title = D.site.title;
    var md = document.querySelector('meta[name="description"]');
    if (md && D.site.description) md.setAttribute('content', D.site.description);
  }

  /* ---------- 导航 ---------- */
  var nav = D.nav || [];
  $('#navDesk').innerHTML = nav.map(function(n){
    return '<a class="nav-link" href="#' + n.id + '" data-nav="' + n.id + '">' + esc(n.label) + '</a>';
  }).join('');
  $('#navMob').innerHTML = nav.map(function(n){
    return '<a class="mmenu-link" href="#' + n.id + '" data-nav="' + n.id + '">' + esc(n.label) + '</a>';
  }).join('');
  if (D.hero && D.hero.brand) $('#brand').textContent = D.hero.brand;

  /* ---------- 首屏 ---------- */
  var H = D.hero || {};
  $('#hNameCn').textContent = H.nameCn || '';
  $('#hNameEn').textContent = H.nameEn || '';
  $('#hMotto').textContent = H.motto || '';
  $('#hOrg').textContent = H.org || '';
  $('#hTag').textContent = H.tagline || '';
  $('#hBtns').innerHTML = (H.buttons || []).map(function(b){
    return '<a class="btn btn-' + (b.style || 'primary') + '" href="' + esc(b.href || '#') + '">' + esc(b.label) + '</a>';
  }).join('');
  $('#scrollHint').innerHTML = ico('chevron');

  /* ---------- 关于我 ---------- */
  var A = D.about || {};
  $('#aboutWrap').innerHTML =
    '<div class="sec-head reveal">' +
      '<h2 class="sec-title bar3">' + esc(A.title || '关于我') + '</h2>' +
      '<p class="sec-sub">' + esc(A.subtitle || '') + '</p>' +
    '</div>' +
    '<div class="about-grid">' +
      '<div class="about-left reveal-stagger">' +
        '<p class="quote">' + esc(A.quote || '') + '</p>' +
        (A.paragraphs || []).map(function(p){ return '<p class="about-p">' + esc(p) + '</p>'; }).join('') +
        '<div class="tags">' + (A.tags || []).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '</div>' +
      '<div class="about-right reveal-stagger"><div class="info-grid">' +
        (A.info || []).map(function(c){
          return '<div class="info-card">' +
            '<div class="info-ico t-' + esc(c.tone || 'amber') + '">' + ico(c.icon) + '</div>' +
            '<p class="info-label">' + esc(c.label) + '</p>' +
            '<p class="info-val">' + esc(c.value) + '</p>' +
          '</div>';
        }).join('') +
      '</div></div>' +
    '</div>';

  /* ---------- 工作职责 ---------- */
  var W = D.work || {};
  $('#workWrap').innerHTML =
    '<div class="sec-head reveal">' +
      '<h2 class="sec-title tick">' + esc(W.title || '工作职责') + '</h2>' +
      '<p class="sec-sub">' + esc(W.subtitle || '') + '</p>' +
    '</div>' +
    '<div class="work-grid reveal-stagger">' +
      (W.cards || []).map(function(c){
        return '<article class="work-card">' +
          '<div class="work-ico">' + ico(c.icon) + '</div>' +
          '<h3 class="work-title">' + esc(c.title) + '</h3>' +
          '<p class="work-sub">' + esc(c.sub) + '</p>' +
          '<p class="work-desc">' + esc(c.desc) + '</p>' +
          '<div class="work-tags">' + (c.tags || []).map(function(t){ return '<span class="work-tag">' + ico(TAG_ICONS[t] || 'dot') + esc(t) + '</span>'; }).join('') + '</div>' +
        '</article>';
      }).join('') +
    '</div>' +
    (W.note ? '<p class="work-note">' + ico('car') + '<span>' + esc(W.note) + '</span></p>' : '');

  /* ---------- 技能矩阵 ---------- */
  var S = D.skills || {};
  var flat = [];
  (S.groups || []).forEach(function(g){ (g.items || []).forEach(function(it){ flat.push(it); }); });
  $('#skillsWrap').innerHTML =
    '<div class="sec-head reveal">' +
      '<h2 class="sec-title bar4">' + esc(S.title || '技能矩阵') + '</h2>' +
      '<p class="sec-sub">' + esc(S.subtitle || '') + '</p>' +
    '</div>' +
    '<div class="skills-grid reveal-stagger">' +
      flat.map(function(s){
        return '<article class="skill-card" style="--brand:' + esc(s.color) + ';--brand-soft:' + tint(s.color, .13) + '">' +
          '<span class="sk-sheen"></span>' +
          '<div class="sk-avatar">' + esc(s.letter || '') + '</div>' +
          '<h3 class="sk-name">' + esc(s.name) + '</h3>' +
          '<p class="sk-desc">' + esc(s.desc) + '</p>' +
        '</article>';
      }).join('') +
    '</div>' +
    '<div class="sk-legend reveal">' +
      (S.groups || []).map(function(g){
        var c = (g.items && g.items[0] && g.items[0].color) || '#888';
        return '<span><i class="legend-dot" style="background:' + esc(c) + '"></i>' + esc(g.group) + '</span>';
      }).join('') +
    '</div>';

  /* ---------- 兴趣爱好 ---------- */
  var HB = D.hobbies || {};
  var TERM = HB.terminal || [];
  var DOG = HB.dogtag || {};
  $('#hobbiesWrap').innerHTML =
    '<div class="sec-head reveal">' +
      '<h2 class="sec-title bar4">' + esc(HB.title || '兴趣爱好') + '</h2>' +
      '<p class="sec-sub">' + esc(HB.subtitle || '') + '</p>' +
    '</div>' +
    '<div class="hob-list reveal-stagger">' +
      (HB.tags || []).map(function(t){
        var pill = '<button class="hobby-pill' + (t.egg ? ' egg' : '') + '" type="button"' +
          (t.egg ? ' aria-expanded="false"' : '') + '>' + ico(HB_ICONS[t.label] || 'dot') + esc(t.label) +
          (t.egg ? '<span class="spark" aria-hidden="true">✨</span>' : '') + '</button>';
        if (!t.egg) return '<span class="hobby-wrap">' + pill + '</span>';
        var pop = '';
        if (t.egg === 'terminal') {
          pop = '<div class="egg-pop" role="dialog" aria-label="Linux 终端彩蛋"><div class="term">' +
            '<div class="term-bar">' +
              '<i class="term-dot" style="background:#FF5F57"></i>' +
              '<i class="term-dot" style="background:#FEBC2E"></i>' +
              '<i class="term-dot" style="background:#28C840"></i>' +
              '<small>bash</small>' +
            '</div><div class="term-body"></div></div></div>';
        } else if (t.egg === 'dogtag') {
          pop = '<div class="egg-pop" role="dialog" aria-label="军迷身份牌彩蛋"><div class="dogtag">' +
            '<div class="dt-head"><span>🛡</span><span>DOG TAG</span></div>' +
            '<div class="dt-row"><span class="dt-key">NAME:</span><span class="dt-val">' + esc(DOG.name || '') + '</span></div>' +
            '<div class="dt-row"><span class="dt-key">UNIT:</span><span class="dt-val">' + esc(DOG.unit || '') + '</span></div>' +
            '<div class="dt-row"><span class="dt-key">BLOOD:</span><span class="dt-val dt-blood">' + esc(DOG.blood || '') + '</span></div>' +
            '<p class="dt-motto">“' + esc((DOG.mottos || [''])[0]) + '”</p>' +
          '</div></div>';
        } else if (t.egg === 'note') {
          pop = '<div class="egg-pop" role="dialog" aria-label="' + esc(t.label) + '彩蛋"><div class="term">' +
            '<div class="term-bar">' +
              '<i class="term-dot" style="background:#FF5F57"></i>' +
              '<i class="term-dot" style="background:#FEBC2E"></i>' +
              '<i class="term-dot" style="background:#28C840"></i>' +
              '<small>' + esc(t.label) + '</small>' +
            '</div><div class="note-body">' +
              (t.note || []).map(function(l){
                return '<p class="note-line' + (String(l).indexOf('> ') === 0 ? ' hl' : '') + '">' + esc(l) + '</p>';
              }).join('') +
            '</div></div></div>';
        }
        return '<span class="hobby-wrap" data-egg="' + t.egg + '">' + pill + pop + '</span>';
      }).join('') +
    '</div>';

  /* ---------- 个人积累 ---------- */
  var P = D.portfolio || {};
  $('#pfWrap').innerHTML =
    '<div class="sec-head reveal">' +
      '<h2 class="sec-title bar3">' + esc(P.title || '个人积累') + '</h2>' +
      '<p class="sec-sub">' + esc(P.subtitle || '') + '</p>' +
    '</div>' +
    '<div class="pf-grid reveal-stagger">' +
      (P.items || []).map(function(it){
        return '<a class="pf-card" href="' + esc(it.url) + '" target="_blank" rel="noopener" style="--brand:' + esc(it.color) + '">' +
          '<div class="pf-top">' +
            '<span class="pf-ico">' + esc(it.letter || '') + '</span>' +
            '<span class="pf-plat">' + esc(it.platform) + '</span>' +
          '</div>' +
          '<h3 class="pf-title">' + esc(it.title) + '</h3>' +
          '<p class="pf-desc">' + esc(it.desc) + '</p>' +
          '<span class="pf-link">访问链接 ' + ico('arrowUpRight') + '</span>' +
        '</a>';
      }).join('') +
    '</div>';

  /* ---------- 联系我 ---------- */
  var C = D.contact || {};
  $('#ctWrap').innerHTML =
    '<div class="sec-head reveal">' +
      '<h2 class="sec-title bar3">' + esc(C.title || '联系我') + '</h2>' +
      '<p class="sec-sub">' + esc(C.subtitle || '') + '</p>' +
    '</div>' +
    '<div class="ct-methods reveal-stagger">' +
      (C.methods || []).map(function(m){
        return '<a class="ct-card" href="' + esc(m.href) + '">' +
          '<span class="ct-ico">' + ico(m.icon) + '</span>' +
          '<span><span class="ct-label">' + esc(m.label) + '</span><span class="ct-val" style="display:block">' + esc(m.value) + '</span></span>' +
          '<span class="ct-out">' + ico('external') + '</span>' +
        '</a>';
      }).join('') +
    '</div>' +
    '<p class="ct-sub reveal">沟通偏好</p>' +
    '<div class="prefs reveal">' +
      (C.preferences || []).map(function(p){
        return '<span class="pref pref-' + esc(p.level) + '">' +
          '<span aria-hidden="true">' + esc(p.emoji) + '</span>' + esc(p.label) +
          '<span class="pref-rank">' + esc(p.rank) + '</span>' +
        '</span>';
      }).join('') +
    '</div>' +
    '<div class="ct-notes reveal">' +
      (C.notes || []).map(function(n){ return '<span>' + ico(n.icon) + esc(n.text) + '</span>'; }).join('') +
    '</div>' +
    '<div class="ct-offices reveal-stagger">' +
      (C.offices || []).map(function(o){
        return '<div class="office">' + ico('pin') +
          '<div><p class="office-label">' + esc(o.label) + '</p><p class="office-val">' + esc(o.value) + '</p></div>' +
        '</div>';
      }).join('') +
    '</div>';

  /* ---------- 页脚 ---------- */
  var F = D.footer || {};
  $('#fMotto').textContent = F.motto || '';
  $('#fCopy').textContent = F.copyright || '';
  $('#printBtn').innerHTML = ico('printer') + '打印 / 存为 PDF';
  document.querySelector('.foot-top').innerHTML = '回到顶部 ' + ico('arrowUp');

  /* ---------- 滚动揭示 ---------- */
  var revealables = document.querySelectorAll('.reveal, .reveal-stagger');
  if ('IntersectionObserver' in window) {
    var ro = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) { en.target.classList.add('in'); ro.unobserve(en.target); }
      });
    }, { rootMargin: '-80px 0px' });
    revealables.forEach(function(n){ ro.observe(n); });
  } else {
    revealables.forEach(function(n){ n.classList.add('in'); });
  }

  /* ---------- 导航高亮 ---------- */
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('[data-nav]'));
  function setActive(id){
    navLinks.forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-nav') === id);
    });
  }
  setActive('hero');
  if ('IntersectionObserver' in window) {
    var secs = nav.map(function(n){ return document.getElementById(n.id); }).filter(Boolean);
    var so = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) setActive(en.target.id);
      });
    }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });
    secs.forEach(function(s){ so.observe(s); });
  }

  /* ---------- 移动端菜单 ---------- */
  var burger = $('#burger'), mmenu = $('#mmenu');
  function closeMenu(){
    mmenu.classList.remove('open');
    mmenu.setAttribute('aria-hidden', 'true');
    burger.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('locked');
  }
  burger.addEventListener('click', function(){
    var open = !mmenu.classList.contains('open');
    mmenu.classList.toggle('open', open);
    mmenu.setAttribute('aria-hidden', open ? 'false' : 'true');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.body.classList.toggle('locked', open);
  });
  mmenu.addEventListener('click', function(e){
    if (e.target.closest('a')) closeMenu();
  });

  /* ---------- 向下箭头 / 打印 ---------- */
  $('#scrollHint').addEventListener('click', function(){
    var a = document.getElementById('about');
    if (a) a.scrollIntoView({ behavior: 'smooth' });
  });
  $('#printBtn').addEventListener('click', function(){ window.print(); });

  /* ---------- 技能卡 3D 微倾 ---------- */
  if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
    Array.prototype.forEach.call(document.querySelectorAll('.skill-card'), function(card){
      card.addEventListener('mousemove', function(e){
        var r = card.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width - .5;
        var py = (e.clientY - r.top) / r.height - .5;
        card.style.transform = 'perspective(1000px) rotateX(' + (-py * 5).toFixed(2) + 'deg) rotateY(' +
          (px * 5).toFixed(2) + 'deg) scale(1.04)';
      });
      card.addEventListener('mouseleave', function(){ card.style.transform = ''; });
    });
  }

  /* ---------- 爱好彩蛋 ---------- */
  var termTimer = null, termToken = 0;
  function stopTyping(){ termToken++; if (termTimer) { clearTimeout(termTimer); termTimer = null; } }

  function typeTerminal(body){
    stopTyping();
    var token = termToken;
    body.innerHTML = '';
    var li = 0, si = 0, ci = 0, lineEl = null, span = null;
    var cursor = document.createElement('span');
    cursor.className = 'term-cursor';

    function step(){
      if (token !== termToken) return;
      if (li >= TERM.length) { return; }
      if (!lineEl) {
        lineEl = document.createElement('div');
        lineEl.className = 'term-line';
        body.appendChild(lineEl);
        si = 0; ci = 0; span = null;
      }
      var segs = TERM[li];
      if (!segs || si >= segs.length) {
        li++; lineEl = null;
        termTimer = setTimeout(step, 300);
        return;
      }
      var seg = segs[si];
      if (!span) {
        span = document.createElement('span');
        span.className = 't-' + (seg.c || 'out');
        lineEl.appendChild(span);
      }
      if (ci < seg.t.length) {
        span.textContent += seg.t.charAt(ci++);
        if (cursor.parentNode !== lineEl) lineEl.appendChild(cursor);
        termTimer = setTimeout(step, 40);
      } else {
        si++; span = null; ci = 0;
        if (cursor.parentNode !== lineEl) lineEl.appendChild(cursor);
        termTimer = setTimeout(step, 70);
      }
    }
    step();
  }

  function randomDogtag(pop){
    var m = (DOG.mottos || []);
    var node = pop.querySelector('.dt-motto');
    if (node && m.length) {
      node.textContent = '“' + m[Math.floor(Math.random() * m.length)] + '”';
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.hobby-wrap[data-egg]'), function(w){
    var pill = w.querySelector('.hobby-pill');
    var pop = w.querySelector('.egg-pop');
    if (!pill || !pop) return;
    var closeTimer = null;

    function open(){
      if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
      Array.prototype.forEach.call(document.querySelectorAll('.hobby-wrap.open'), function(o){
        if (o !== w) {
          o.classList.remove('open');
          var b = o.querySelector('.hobby-pill');
          if (b) b.setAttribute('aria-expanded', 'false');
        }
      });
      w.classList.add('open');
      pill.setAttribute('aria-expanded', 'true');
      var body = pop.querySelector('.term-body');
      if (body) typeTerminal(body); else randomDogtag(pop);
    }
    function close(){
      closeTimer = setTimeout(function(){
        w.classList.remove('open');
        pill.setAttribute('aria-expanded', 'false');
        stopTyping();
      }, 140);
    }
    w.addEventListener('mouseenter', open);
    w.addEventListener('mouseleave', close);
    pill.addEventListener('click', function(e){
      e.preventDefault();
      if (w.classList.contains('open')) {
        w.classList.remove('open');
        pill.setAttribute('aria-expanded', 'false');
        stopTyping();
      } else open();
    });
    pill.addEventListener('keydown', function(e){
      if (e.key === 'Escape') {
        w.classList.remove('open');
        pill.setAttribute('aria-expanded', 'false');
        stopTyping();
      }
    });
  });

  /* ---------- 页内锚点平滑滚动（含固定头部偏移） ---------- */
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var target = id ? document.getElementById(id) : null;
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    history.replaceState(null, '', '#' + id);
  });

  /* ---------- Esc 关闭菜单 ---------- */
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && mmenu.classList.contains('open')) closeMenu();
  });

  /* ---------- 截图自查开关 ---------- */
  if (location.hash.indexOf('capture') > -1) {
    document.documentElement.classList.add('capture');
    Array.prototype.forEach.call(revealables, function(n){ n.classList.add('in'); });
    Array.prototype.forEach.call(document.querySelectorAll('.hobby-wrap[data-egg]'), function(w){
      w.classList.add('open');
      var body = w.querySelector('.term-body');
      if (body) {
        body.innerHTML = TERM.map(function(line){
          return '<div class="term-line">' + line.map(function(seg){
            return '<span class="t-' + (seg.c || 'out') + '">' + esc(seg.t) + '</span>';
          }).join('') + '</div>';
        }).join('') + '<span class="term-cursor"></span>';
      }
    });
  }
})();
</script>
</body>
</html>
