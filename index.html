<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="个人主页">
<title>个人主页</title>
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --text:#1B1B18; --text-2:#57564F; --text-3:#8A8880;
  --line:#E6E4DC; --accent:#17604F; --accent-soft:#E8F2EE;
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1B1B1A; --text:#F0EFE9; --text-2:#A8A69C; --text-3:#75736B;
  --line:#2E2E2B; --accent:#6FD3B4; --accent-soft:#1C2B26;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.75;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
}
.wrap{max-width:780px;margin:0 auto;padding:0 28px}
nav{
  position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);
  background:var(--bg);backdrop-filter:saturate(180%) blur(14px);
}
.nav-in{max-width:780px;margin:0 auto;padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:14px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlinks{display:flex;gap:24px;margin-left:auto}
.navlinks a{color:var(--text-2);text-decoration:none;font-size:13.5px;transition:color .18s}
.navlinks a:hover{color:var(--text)}
.navbtns{display:flex;gap:6px;margin-left:4px}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);
  border-radius:8px;padding:0;transition:.18s;font:inherit;
}
.icon-btn:hover{color:var(--text);border-color:var(--text-3)}
.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico-moon{display:none}
[data-theme="dark"] .ico-moon{display:block}
[data-theme="dark"] .ico-sun{display:none}

.hero{padding:80px 0 52px}
.avatar{
  width:56px;height:56px;border-radius:17px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:22px;font-weight:600;margin-bottom:26px;user-select:none;
}
h1{font-size:44px;line-height:1.15;letter-spacing:-.025em;margin:0 0 12px;font-weight:600}
.role{font-size:16px;color:var(--text-2);margin:0 0 18px}
.tagline{font-size:17px;line-height:1.7;margin:0 0 28px;max-width:30em}
.contacts{display:flex;flex-wrap:wrap;gap:8px 20px;list-style:none;padding:0;margin:0;font-size:13.5px;color:var(--text-2)}
.contacts a{color:var(--text-2);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px;transition:.18s}
.contacts a:hover{color:var(--accent);border-color:var(--accent)}

.section{padding:46px 0;border-top:1px solid var(--line)}
h2{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--text-3);margin:0 0 26px}
.about p{margin:0 0 16px;color:var(--text-2);max-width:44em;line-height:1.85}
.about p:last-child{margin-bottom:0}

.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.skill-card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--surface)}
.skill-card h3{font-size:13px;font-weight:600;margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-2);border:1px solid var(--line);line-height:1.6}

.tl-item{display:grid;grid-template-columns:134px 1fr;gap:24px;padding-bottom:30px}
.tl-item:last-child{padding-bottom:0}
.tl-period{font-size:12.5px;color:var(--text-3);padding-top:4px;font-variant-numeric:tabular-nums}
.tl-body h3{font-size:16px;font-weight:600;margin:0 0 2px}
.tl-company{color:var(--text-2);font-weight:400;font-size:14.5px}
.tl-body ul{margin:10px 0 0;padding:0;list-style:none}
.tl-body li{position:relative;padding-left:16px;color:var(--text-2);font-size:14px;margin-bottom:6px;line-height:1.75}
.tl-body li::before{content:"";position:absolute;left:0;top:12px;width:6px;height:1px;background:var(--text-3)}
.tl-body li:last-child{margin-bottom:0}

.proj{padding:20px 0;border-bottom:1px solid var(--line)}
.proj:first-child{padding-top:0}
.proj:last-child{border-bottom:none;padding-bottom:0}
.proj-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:5px}
.proj-head h3{font-size:15.5px;font-weight:600;margin:0}
.proj-year{font-size:12.5px;color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}
.proj p{margin:0 0 11px;color:var(--text-2);font-size:14px;max-width:46em}

footer{border-top:1px solid var(--line);padding:26px 0 64px;font-size:12.5px;color:var(--text-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty-hint{padding:120px 28px;text-align:center;color:var(--text-2);font-size:14px;line-height:1.9}

@media(max-width:640px){
  .navlinks{display:none}
  .wrap,.nav-in{padding:0 20px}
  .hero{padding:56px 0 40px}
  h1{font-size:34px}
  .tagline{font-size:16px}
  .skill-grid{grid-template-columns:1fr}
  .tl-item{grid-template-columns:1fr;gap:5px;padding-bottom:26px}
  .tl-period{padding-top:0}
  .section{padding:36px 0}
}
@media print{
  nav,.noprint{display:none!important}
  body{background:#fff!important;color:#000!important;font-size:10.5pt;line-height:1.6}
  .wrap{max-width:100%;padding:0}
  .hero{padding:0 0 16pt}
  .avatar{display:none}
  h1{font-size:21pt;margin-bottom:6pt}
  .tagline{font-size:11pt;margin-bottom:12pt}
  .section{padding:12pt 0;border-top:1px solid #ddd}
  h2{margin-bottom:10pt;color:#666!important}
  .tl-item,.proj,.skill-card{page-break-inside:avoid}
  .skill-card{background:none;border-color:#ddd}
  .tag{background:none;border-color:#ddd}
  .about p,.tl-body li,.proj p{color:#333!important}
  .contacts,.contacts a{color:#333!important}
  a{color:#000!important;text-decoration:none}
  footer{border-top:1px solid #ddd;padding:10pt 0 0}
}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <div class="brand" id="brand">个人主页</div>
    <div class="navlinks" id="navlinks"></div>
    <div class="navbtns">
      <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换深色模式">
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="printBtn" title="打印 / 存为 PDF" aria-label="打印">
        <svg viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="tagline" id="tagline"></p>
    <ul class="contacts" id="contacts"></ul>
  </div>
</header>

<main>
  <section class="section" id="about"><div class="wrap"><h2>关于我</h2><div class="about" id="aboutBody"></div></div></section>
  <section class="section" id="skills"><div class="wrap"><h2>技能</h2><div class="skill-grid" id="skillsBody"></div></div></section>
  <section class="section" id="experience"><div class="wrap"><h2>工作经历</h2><div id="expBody"></div></div></section>
  <section class="section" id="projects"><div class="wrap"><h2>项目</h2><div id="projBody"></div></div></section>
  <section class="section" id="education"><div class="wrap"><h2>教育经历</h2><div id="eduBody"></div></div></section>
</main>

<footer><div class="wrap" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%">
  <span id="footNote"></span>
  <span class="noprint" style="opacity:.7">按 Ctrl / ⌘ + P 可存为 PDF 简历</span>
</div></footer>

<script src="content.js"></script>
<script>
(function(){
  var D = window.SITE_DATA;
  if(!D || !D.profile){
    document.body.innerHTML = '<div class="empty-hint">还没有读到内容。<br>请确认 <b>content.js</b> 和本页面在同一个文件夹里，并且文件里 <b>window.SITE_DATA = { ... }</b> 写完整了。</div>';
    return;
  }
  var P = D.profile;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function show(id, html){
    var el = document.getElementById(id);
    if(!el) return;
    if(!html){ var sec = el.closest('section'); if(sec) sec.style.display = 'none'; return; }
    el.innerHTML = html;
  }

  document.title = (P.name || '个人主页') + (P.title ? ' · ' + P.title : '');
  document.getElementById('brand').textContent = P.name || '个人主页';
  document.getElementById('avatar').textContent = (P.name || '·').trim().charAt(0);
  document.getElementById('name').textContent = P.name || '';
  document.getElementById('role').textContent = [P.title, P.subtitle].filter(Boolean).join(' · ');
  document.getElementById('tagline').textContent = P.tagline || '';

  var c = [];
  if(P.location) c.push('<li>' + esc(P.location) + '</li>');
  if(P.email) c.push('<li><a href="mailto:' + esc(P.email) + '">' + esc(P.email) + '</a></li>');
  if(P.phone) c.push('<li>' + esc(P.phone) + '</li>');
  (P.links || []).forEach(function(l){
    if(l && l.url) c.push('<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a></li>');
  });
  document.getElementById('contacts').innerHTML = c.join('');

  show('aboutBody', (D.about || []).map(function(p){ return '<p>' + esc(p) + '</p>'; }).join(''));

  show('skillsBody', (D.skills || []).map(function(g){
    return '<div class="skill-card"><h3>' + esc(g.group) + '</h3><div class="tags">' +
      (g.items || []).map(function(i){ return '<span class="tag">' + esc(i) + '</span>'; }).join('') +
      '</div></div>';
  }).join(''));

  show('expBody', (D.experience || []).map(function(e){
    var pts = (e.points || []).length
      ? '<ul>' + e.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '';
    return '<div class="tl-item"><div class="tl-period">' + esc(e.period) + '</div>' +
      '<div class="tl-body"><h3>' + esc(e.role) +
      (e.company ? ' <span class="tl-company">· ' + esc(e.company) + '</span>' : '') +
      '</h3>' + pts + '</div></div>';
  }).join(''));

  show('projBody', (D.projects || []).map(function(p){
    var tags = (p.tags || []).length
      ? '<div class="tags">' + p.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '';
    return '<article class="proj"><div class="proj-head"><h3>' + esc(p.name) + '</h3>' +
      (p.period ? '<span class="proj-year">' + esc(p.period) + '</span>' : '') + '</div>' +
      '<p>' + esc(p.desc) + '</p>' + tags + '</article>';
  }).join(''));

  show('eduBody', (D.education || []).map(function(e){
    return '<div class="tl-item"><div class="tl-period">' + esc(e.period) + '</div>' +
      '<div class="tl-body"><h3>' + esc(e.school) + '</h3>' +
      (e.major ? '<div class="tl-company" style="font-size:14px">' + esc(e.major) + '</div>' : '') +
      '</div></div>';
  }).join(''));

  document.getElementById('footNote').textContent = D.footer || '';

  var nav = [];
  [['about','关于'],['skills','技能'],['experience','经历'],['projects','项目']].forEach(function(x){
    var sec = document.getElementById(x[0]);
    if(sec && sec.style.display !== 'none') nav.push('<a href="#' + x[0] + '">' + x[1] + '</a>');
  });
  document.getElementById('navlinks').innerHTML = nav.join('');

  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem('site-theme'); } catch(e){}
  if(saved === 'dark' || saved === 'light'){
    root.setAttribute('data-theme', saved);
  } else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    root.setAttribute('data-theme', 'dark');
  }
  document.getElementById('themeBtn').addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('site-theme', next); } catch(e){}
  });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
})();
</script>
</body>
</html>
